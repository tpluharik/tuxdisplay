name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and verify
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      TARGET_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install build dependencies
        timeout-minutes: 5
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --retries 3 --timeout 30 cryptography==49.0.0
      - name: Test and build
        run: |
          python -m unittest discover -s tests -v
          ./build-deb.sh
      - name: Match package to signed manifest
        shell: bash
        run: |
          version=${TARGET_TAG#v}
          package="dist/tuxdisplay_${version}_all.deb"
          test -f "$package"
          expected=$(python3 -c 'import json; print(json.load(open("update/latest.json"))["sha256"])')
          actual=$(sha256sum "$package" | cut -d' ' -f1)
          test "$expected" = "$actual"
          test "$(python3 -c 'import json; print(json.load(open("update/latest.json"))["version"])')" = "$version"
      - name: Attest package provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: 'dist/tuxdisplay_*_all.deb'
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            gh release upload "$TARGET_TAG" dist/tuxdisplay_*_all.deb dist/SHA256SUMS --clobber
          else
            gh release create "$TARGET_TAG" dist/tuxdisplay_*_all.deb dist/SHA256SUMS --verify-tag --title "TuxDisplay ${TARGET_TAG#v}" --generate-notes
          fi
