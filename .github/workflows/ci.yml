name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test dependencies
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if python3 -c 'import gi; gi.require_version("Gst", "1.0"); from gi.repository import Gst; import cryptography'; then
            exit 0
          fi
          sudo apt-get -o DPkg::Lock::Timeout=60 install --yes --no-install-recommends \
            gir1.2-gst-plugins-base-1.0 gir1.2-gstreamer-1.0 python3-cryptography python3-gi
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build twice and compare
        shell: bash
        run: |
          ./build-deb.sh
          first=$(sha256sum dist/tuxdisplay_*_all.deb | cut -d' ' -f1)
          rm -rf build
          ./build-deb.sh
          second=$(sha256sum dist/tuxdisplay_*_all.deb | cut -d' ' -f1)
          test "$first" = "$second"
          dpkg-deb --info dist/tuxdisplay_*_all.deb
