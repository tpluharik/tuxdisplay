name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install test dependencies
        timeout-minutes: 5
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --retries 3 --timeout 30 cryptography==49.0.0
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build twice and compare
        shell: bash
        run: |
          ./build-deb.sh
          first=$(sha256sum dist/tuxdisplay_*_all.deb | cut -d' ' -f1)
          rm -rf build
          ./build-deb.sh
          second=$(sha256sum dist/tuxdisplay_*_all.deb | cut -d' ' -f1)
          test "$first" = "$second"
          dpkg-deb --info dist/tuxdisplay_*_all.deb
